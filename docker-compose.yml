services:
  taskmanager-postgres:
    image: postgres:16-alpine
    container_name: taskmanager-postgres
    environment:
      POSTGRES_DB: trackio
      POSTGRES_USER: trackio
      POSTGRES_PASSWORD: trackio
    ports:
      - "5432:5432"
    volumes:
      - taskmanager-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackio -d trackio"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  taskmanager-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskmanager-api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://taskmanager-postgres:5432/trackio
      SPRING_DATASOURCE_USERNAME: trackio
      SPRING_DATASOURCE_PASSWORD: trackio
    ports:
      - "8081:8080"
    depends_on:
      taskmanager-postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  taskmanager-postgres-data:
